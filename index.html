<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121417">
  <title>Wordle FR</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header>
    <a class="icon-btn" href="https://gclement76.github.io/" title="Mes projets" aria-label="Retour à mes projets">‹</a>
    <h1 class="logo" aria-label="Wordle">
      <span>W</span><span>O</span><span>R</span><span>D</span><span>L</span><span>E</span>
    </h1>
    <button id="new-game" class="icon-btn" title="Nouvelle partie" aria-label="Nouvelle partie">↻</button>
  </header>

  <main>
    <div id="message" role="status" aria-live="polite"></div>
    <div class="board-container">
      <div id="board" aria-label="Grille de jeu"></div>
    </div>
    <div id="keyboard" aria-label="Clavier"></div>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-word"></p>
      <div class="stats">
        <div><span id="stat-played">0</span><small>Parties</small></div>
        <div><span id="stat-winrate">0</span><small>% victoires</small></div>
        <div><span id="stat-streak">0</span><small>Série</small></div>
        <div><span id="stat-best">0</span><small>Meilleure série</small></div>
      </div>
      <button id="replay" class="primary">Rejouer</button>
    </div>
  </div>

  <script src="words.js?v=3"></script>
  <script src="game.js?v=3"></script>
</body>
</html>
